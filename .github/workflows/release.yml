name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to release, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      BUILD_CERTIFICATE_PASSWORD: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'
          git rev-parse -q --verify "refs/tags/${TAG}"
          test "$(git rev-list -n 1 "$TAG")" = "$(git rev-parse HEAD)"
          echo "RELEASE_TAG=${TAG}" >> "$GITHUB_ENV"
          RELEASE_VERSION="${TAG#v}"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${RELEASE_VERSION%%-*}" >> "$GITHUB_ENV"
          if [[ "$TAG" == *-* ]]; then
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Run tests
        run: |
          ./Scripts/legal-audit.sh
          ./Scripts/test.sh --parallel

      - name: Require release review and auth origin
        env:
          LEGAL_RELEASE_APPROVED: ${{ vars.LEGAL_RELEASE_APPROVED }}
          SONOS_AUTH_BASE_URL: ${{ vars.SONOS_AUTH_BASE_URL }}
          PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
        run: |
          printf '%s' "$SONOS_AUTH_BASE_URL" | grep -Eq '^https://[^/ ]+'
          printf '%s' "$PRIVACY_POLICY_URL" | grep -Eq '^https://[^/ ]+'
          if [[ "$IS_PRERELEASE" != "true" ]]; then
            test "$LEGAL_RELEASE_APPROVED" = "true"
          fi

      - name: Import Developer ID certificate
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        run: |
          CERTIFICATE_PATH="${RUNNER_TEMP}/developer-id.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/roomdeck-audio-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$BUILD_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$CERTIFICATE_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n '1s/.*"\(.*\)"/\1/p')"
          test -n "$IDENTITY"
          echo "CODE_SIGN_IDENTITY=${IDENTITY}" >> "$GITHUB_ENV"

      - name: Build app
        run: |
          APP_VERSION="$APP_VERSION" \
          BUILD_NUMBER="$GITHUB_RUN_NUMBER" \
          SONOS_AUTH_BASE_URL="${{ vars.SONOS_AUTH_BASE_URL }}" \
          PRIVACY_POLICY_URL="${{ vars.PRIVACY_POLICY_URL }}" \
          CODE_SIGN_IDENTITY="${CODE_SIGN_IDENTITY:--}" \
          ./Scripts/build-app.sh

      - name: Create release archive
        run: |
          ARCHIVE="dist/RoomDeck-Audio-${RELEASE_VERSION}-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/RoomDeck Audio.app" "$ARCHIVE"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Notarize signed archive
        if: env.BUILD_CERTIFICATE_BASE64 != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          xcrun notarytool submit "$ARCHIVE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait
          xcrun stapler staple "dist/RoomDeck Audio.app"
          rm "$ARCHIVE"
          ditto -c -k --sequesterRsrc --keepParent "dist/RoomDeck Audio.app" "$ARCHIVE"

      - name: Verify and checksum
        run: |
          codesign --verify --deep --strict "dist/RoomDeck Audio.app"
          test "$(plutil -extract LSMultipleInstancesProhibited raw "dist/RoomDeck Audio.app/Contents/Info.plist")" = "true"
          file "dist/RoomDeck Audio.app/Contents/MacOS/RoomDeckAudio" | grep -q arm64
          ARCHIVE_DIR="$(dirname "$ARCHIVE")"
          ARCHIVE_NAME="$(basename "$ARCHIVE")"
          (cd "$ARCHIVE_DIR" && shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256")

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$ARCHIVE" "${ARCHIVE}.sha256" --clobber
          else
            PRERELEASE_ARGS=()
            if [[ "$IS_PRERELEASE" == "true" ]]; then
              PRERELEASE_ARGS+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "$ARCHIVE" "${ARCHIVE}.sha256" \
              --verify-tag \
              --title "RoomDeck Audio ${RELEASE_VERSION}" \
              --generate-notes \
              "${PRERELEASE_ARGS[@]}"
          fi
